[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "insider-signals-mcp"
version = "1.1.0"
description = "Local stdio MCP proxy for the TradeStar Insider server — filing-verified SEC Form 4 insider buying signals plus 13D, 8-K, and 13F verify/fact-check tools. No API key, no sign-in; a lookup and verification layer, not a trading edge."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["sec", "edgar", "form-4", "insider-trading", "finance", "mcp", "mcp-server", "stdio"]
authors = [{ name = "TradeStar Insider" }]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
  "mcp>=2.2.0",
  # server.py imports httpx2 directly (the httpx successor the MCP SDK moved to);
  # declare it rather than relying on mcp pulling it in transitively.
  "httpx2>=2.5.0",
]

[project.scripts]
insider-signals-mcp = "insider_signals_mcp.server:main"

[project.urls]
Homepage = "https://www.tradestarinsider.com"
Repository = "https://github.com/TradestarV5/insider-signals"
"MCP server" = "https://mcp.tradestarinsider.com/mcp"
"Status page" = "https://status.tradestarinsider.com"

[tool.hatch.build.targets.wheel]
packages = ["src/insider_signals_mcp"]

[tool.hatch.build.targets.sdist]
include = [
  "src/insider_signals_mcp",
  "README.md",
  "LICENSE",
]
